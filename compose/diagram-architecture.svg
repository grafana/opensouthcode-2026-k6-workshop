<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#696969"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF671D"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2970FF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#f9f9fa" rx="8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>

  <!-- Observability boundary -->
  <rect x="448" y="16" width="340" height="240" rx="8" fill="none" stroke="rgba(23,23,23,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="464" y="9" width="92" height="14" rx="2" fill="#f9f9fa"/>
  <text x="510" y="19" fill="#AFAFAF" font-size="8" font-family="Roboto Mono, monospace" text-anchor="middle" letter-spacing="0.12em">OBSERVABILITY</text>

  <!-- ARROWS — before nodes -->

  <!-- k6 → QuickPizza (accent, primary test flow) -->
  <line x1="136" y1="116" x2="212" y2="116" stroke="#FF671D" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- QuickPizza → QuickPizza DB -->
  <line x1="316" y1="140" x2="316" y2="184" stroke="#696969" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- QuickPizza → Alloy (OTLP) -->
  <line x1="368" y1="116" x2="456" y2="116" stroke="#2970FF" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- Alloy → Prometheus -->
  <line x1="576" y1="100" x2="632" y2="72" stroke="#696969" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Alloy → Loki -->
  <line x1="576" y1="112" x2="632" y2="116" stroke="#696969" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Alloy → Tempo -->
  <line x1="576" y1="124" x2="632" y2="160" stroke="#696969" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Alloy → Pyroscope -->
  <line x1="576" y1="132" x2="632" y2="204" stroke="#696969" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Grafana → Prometheus (read, dashed, going up-left) -->
  <line x1="668" y1="256" x2="668" y2="80" stroke="#696969" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- NODES -->

  <!-- k6 (input/external) -->
  <rect x="16" y="94" width="120" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="16" y="94" width="120" height="44" rx="6" fill="rgba(105,105,105,0.10)" stroke="#AFAFAF" stroke-width="1"/>
  <text x="76" y="120" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">k6</text>
  <text x="76" y="133" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">load generator</text>

  <!-- QuickPizza (focal) -->
  <rect x="212" y="94" width="156" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="212" y="94" width="156" height="44" rx="6" fill="rgba(255,103,29,0.08)" stroke="#FF671D" stroke-width="1"/>
  <text x="290" y="120" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">QuickPizza</text>
  <text x="290" y="133" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">:3333</text>

  <!-- QuickPizza DB (store) -->
  <rect x="256" y="184" width="120" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="256" y="184" width="120" height="44" rx="6" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="316" y="210" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Postgres</text>
  <text x="316" y="223" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">:5432</text>

  <!-- Alloy (backend) -->
  <rect x="456" y="94" width="120" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="456" y="94" width="120" height="44" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
  <text x="516" y="120" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Alloy</text>
  <text x="516" y="133" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">collector</text>

  <!-- Prometheus (store) -->
  <rect x="632" y="48" width="140" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="632" y="48" width="140" height="44" rx="6" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="702" y="74" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Prometheus</text>
  <text x="702" y="87" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">metrics :9090</text>

  <!-- Loki (store) -->
  <rect x="632" y="94" width="140" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="632" y="94" width="140" height="44" rx="6" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="702" y="120" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Loki</text>
  <text x="702" y="133" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">logs :3100</text>

  <!-- Tempo (store) -->
  <rect x="632" y="140" width="140" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="632" y="140" width="140" height="44" rx="6" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="702" y="166" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Tempo</text>
  <text x="702" y="179" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">traces :3200</text>

  <!-- Pyroscope (store) -->
  <rect x="632" y="184" width="140" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="632" y="184" width="140" height="44" rx="6" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="702" y="210" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Pyroscope</text>
  <text x="702" y="223" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">profiles :4040</text>

  <!-- Grafana (backend) -->
  <rect x="456" y="256" width="320" height="44" rx="6" fill="#f9f9fa"/>
  <rect x="456" y="256" width="320" height="44" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
  <text x="616" y="282" fill="#171717" font-size="12" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Grafana</text>
  <text x="616" y="295" fill="#696969" font-size="9" font-family="Roboto Mono, monospace" text-anchor="middle">dashboards :3000</text>

  <!-- ARROW LABELS — after nodes -->

  <!-- k6 → QuickPizza label -->
  <rect x="146" y="104" width="36" height="12" rx="2" fill="#f9f9fa"/>
  <text x="164" y="113" fill="#FF671D" font-size="8" font-family="Roboto Mono, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

  <!-- QuickPizza → DB label -->
  <rect x="296" y="152" width="40" height="12" rx="2" fill="#f9f9fa"/>
  <text x="316" y="161" fill="#696969" font-size="8" font-family="Roboto Mono, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

  <!-- QuickPizza → Alloy label -->
  <rect x="384" y="104" width="40" height="12" rx="2" fill="#f9f9fa"/>
  <text x="404" y="113" fill="#2970FF" font-size="8" font-family="Roboto Mono, monospace" text-anchor="middle" letter-spacing="0.06em">OTLP</text>

  <!-- Grafana query label -->
  <rect x="648" y="192" width="40" height="12" rx="2" fill="#f9f9fa"/>
  <text x="668" y="201" fill="#696969" font-size="8" font-family="Roboto Mono, monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

  <!-- Legend strip -->
  <line x1="20" y1="282" x2="436" y2="282" stroke="rgba(23,23,23,0.10)" stroke-width="0.8"/>

  <rect x="20" y="290" width="12" height="10" rx="2" fill="rgba(255,103,29,0.08)" stroke="#FF671D" stroke-width="1"/>
  <text x="38" y="299" fill="#696969" font-size="9" font-family="Inter, sans-serif">App under test</text>

  <rect x="144" y="290" width="12" height="10" rx="2" fill="#ffffff" stroke="#171717" stroke-width="1"/>
  <text x="162" y="299" fill="#696969" font-size="9" font-family="Inter, sans-serif">Service</text>

  <rect x="216" y="290" width="12" height="10" rx="2" fill="rgba(23,23,23,0.05)" stroke="#696969" stroke-width="1"/>
  <text x="234" y="299" fill="#696969" font-size="9" font-family="Inter, sans-serif">Store</text>

  <rect x="280" y="290" width="12" height="10" rx="2" fill="rgba(105,105,105,0.10)" stroke="#AFAFAF" stroke-width="1"/>
  <text x="298" y="299" fill="#696969" font-size="9" font-family="Inter, sans-serif">External</text>

  <line x1="360" y1="295" x2="384" y2="295" stroke="#2970FF" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="392" y="299" fill="#696969" font-size="9" font-family="Inter, sans-serif">Telemetry</text>
</svg>
