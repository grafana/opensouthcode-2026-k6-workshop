services:
  alloy:
    image: docker.io/grafana/alloy:v1.21.1
    container_name: alloy
    labels:
      - "service.type=instrumentation"
    volumes:
      - "./compose/config.alloy:/config.alloy:z"
    command:
      - run
      - /config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
    ports:
      - "12345:12345"
    environment:
      QUICKPIZZA_HOST: quickpizza:3333
      METRICS_ENDPOINT: http://otel-lgtm:9090/api/v1/write
      TRACES_ENDPOINT: http://otel-lgtm:4317
      LOGS_ENDPOINT: http://otel-lgtm:3100/loki/api/v1/push
      PROFILES_ENDPOINT: http://otel-lgtm:4040
      DEPLOYMENT_ENVIRONMENT: development
      # Default uses the same DB connection as the Quickpizza service. Use empty string to disable.
      DB_O11Y_CONNECTION: "postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable"
      SERVICE_NAMESPACE: "quickpizza"
      DB_SERVICE_NAME: "quickpizza-db"
    depends_on:
      - quickpizza
      - otel-lgtm
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:0.15.27
    container_name: quickpizza
    labels:
      - "service.type=application"
      - "service.namespace=quickpizza"
    ports:
      - "3333:3333"
      - "3334:3334" # gRPC
    environment:
      QUICKPIZZA_OTLP_ENDPOINT: http://alloy:4318
      QUICKPIZZA_TRUST_CLIENT_TRACEID: 1
      QUICKPIZZA_ENABLE_ALL_SERVICES: 1 # 1 for monolithic mode
      QUICKPIZZA_OTEL_SERVICE_INSTANCE_ID: "quickpizza"
      QUICKPIZZA_OTEL_SERVICE_NAME: "quickpizza"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development,service.version=quickpizza-local"
      # QUICKPIZZA_DELAY_RECOMMENDATIONS: "1s"
      # QUICKPIZZA_FAIL_RATE_RECOMMENDATIONS_API_PIZZA_POST: 5
      QUICKPIZZA_DB: "postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable"
      # Enable logging. Possible values: error, warn, debug. Default: info
      # QUICKPIZZA_LOG_LEVEL: debug
    depends_on:
      quickpizza-db:
        condition: service_healthy

  quickpizza-db:
    image: docker.io/library/postgres:18.1
    container_name: quickpizza-db
    labels:
      - "service.type=database"
      - "service.namespace=quickpizza"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickpizza_db
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./compose/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:0.37.0  # caution: image >800MB
    container_name: otel-lgtm
    ports:
      - "3000:3000"
      - "9090:9090"
      - "4317:4317"
    volumes:
      # Add Postgres alongside the image's bundled grafana-datasources.yaml.
      # Mounting the whole provisioning directory would hide the embedded datasources.
      - ./compose/grafana/datasources/datasource.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/postgres.yaml:ro,z
      # Add workshop dashboards without hiding the image's bundled providers.
      - ./compose/grafana/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/workshop.yaml:ro,z
      - ./compose/grafana/dashboards/definitions:/otel-lgtm/grafana/conf/provisioning/dashboards/definitions:ro,z

  k6:
    image: grafana/k6:2.1.0
    container_name: k6
    entrypoint: ["tail", "-f", "/dev/null"]
    labels:
      - "service.type=load-generator"
    environment:
      BASE_URL: http://quickpizza:3333
    volumes:
      - ".:/scripts:z"
    working_dir: /scripts
    depends_on:
      - quickpizza


volumes:
  postgres_data:
